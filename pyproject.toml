[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-recsys-mvalvar"
version = "1.0.0"
description = "Motor de Recomendación Escalable para Retail de Moda con DuckDB, Polars, LightGBM y FastAPI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Manuel Valdivia" }
]
license = { text = "MIT" }
keywords = ["recommender-systems", "ranking", "lightgbm", "polars", "duckdb", "shap", "fastapi"]
dependencies = [
    "polars>=1.0.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.45.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "notebooks",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # Errores de estilo (pycodestyle)
    "W",   # Advertencias de estilo (pycodestyle)
    "F",   # Errores de lógica y sintaxis (pyflakes)
    "I",   # Ordenación de importaciones (isort)
    "B",   # Detección de patrones erróneos (flake8-bugbear)
    "C4",  # Comprensiones de listas y diccionarios (flake8-comprehensions)
    "UP",  # Modernización de sintaxis de Python (pyupgrade)
    "ARG", # Argumentos de funciones no utilizados (flake8-unused-arguments)
]
ignore = ["E501", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "ARG001", "ARG002"]
"scripts/*" = ["E402", "B008", "C408"]
"notebooks/*" = ["E402", "F401", "F841"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]
